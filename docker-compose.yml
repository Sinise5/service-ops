services:
  postgres:
    image: serviceops-postgres:local
    build:
      context: .
      dockerfile: Dockerfile.postgres
    container_name: serviceops_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-serviceops_dev}
    ports:
      - "${POSTGRES_HOST_PORT:-15433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - serviceops-network
  
  redis:
    image: redis:7-alpine
    container_name: serviceops_redis
    ports:
      - "${REDIS_HOST_PORT:-16379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - serviceops-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: serviceops_backend
    ports:
      - "${BACKEND_PORT:-9080}:9080"
    environment:
      PORT: 9080
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-serviceops_dev}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-this-secret}
      NVD_API_KEY: ${NVD_API_KEY:-}
      VULNERABILITY_FEED_INTERVAL_SECONDS: ${VULNERABILITY_FEED_INTERVAL_SECONDS:-300}
      KEV_REFRESH_INTERVAL_SECONDS: ${KEV_REFRESH_INTERVAL_SECONDS:-3600}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - serviceops-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: serviceops_frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:5173/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - serviceops-network

  migrate:
    image: serviceops-postgres:local
    build:
      context: .
      dockerfile: Dockerfile.postgres
    container_name: serviceops_migrate
    entrypoint: ["psql"]
    command:
      - "-h"
      - postgres
      - -U
      - ${POSTGRES_USER:-postgres}
      - -d
      - ${POSTGRES_DB:-serviceops_dev}
      - -v
      - ON_ERROR_STOP=1
      - -f
      - /docker-migration.sql
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - serviceops-network

volumes:
  postgres_data:
  redis_data:

networks:
  serviceops-network:
    driver: bridge
