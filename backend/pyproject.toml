[project]
name = "serviceops"
version = "1.0.0"
description = "ServiceOps — production observability & CMDB platform"
requires-python = ">=3.11"
dependencies = [
    "robyn>=0.84",
    "psycopg>=3.2",
    "redis>=5.0",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "pydantic>=2.5",
    "pydantic-settings>=2.2",
    "email-validator>=2.1",
    "aiohttp>=3.9",
    "aiofiles>=23.2",
    "python-multipart>=0.0.6",
    "httpx>=0.27",
    "aiosmtplib>=3.0",
    "uvicorn>=0.30",
    "psycopg-pool>=3.3.1",
    "asyncssh>=2.14",
    "cryptography>=42.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "pytest-httpx>=0.30",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
